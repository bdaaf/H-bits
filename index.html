<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120e0a">
<title>THE SYSTEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120e0a'/%3E%3Cpath d='M32 10l16 28H16z' fill='%23d9ab4f'/%3E%3Ccircle cx='32' cy='46' r='6' fill='%23ff8f3f'/%3E%3C/svg%3E">
<style>
:root{--void:#120e0a;--panel:#1f1710;--panel2:#2a1f15;--edge:#5b4630;--blue:#d9ab4f;--gold:#f0d48a;--ember:#ff8f3f;--txt:#f0e4c8;--mut:#a8957a;--ok:#5fd0b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--void);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,#3a2414 0,var(--void) 60%) no-repeat;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3,.serif{font-family:'MedievalSharp','Palatino Linotype',Georgia,serif;margin:0;letter-spacing:.2px}
main{max-width:520px;margin:0 auto;padding:12px 14px}
.hero{border:1px solid var(--edge);border-radius:18px;padding:14px;background:linear-gradient(160deg,#2c2016,var(--panel));box-shadow:0 0 0 1px #0e0a07 inset,0 0 28px #ff8f3f22}
.hero .row{display:flex;align-items:center;gap:12px}
.rank{width:58px;height:58px;border-radius:14px;border:2px solid var(--gold);display:grid;place-items:center;font:700 30px Georgia,serif;color:var(--gold);background:#17100a;box-shadow:0 0 18px #f0d48a40}
.hero h1{font-size:22px}
.sub{color:var(--mut);font-size:13px}
.bar{height:10px;border-radius:6px;background:#0e0a07;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#a77a22,var(--blue));transition:width .5s}
h2{font-size:18px;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font:13px system-ui;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hc{position:relative;border:1px solid var(--edge);border-radius:14px;background:var(--panel);padding:10px 6px 8px;text-align:center;cursor:pointer;min-height:132px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s,background .3s}
.hc:active{transform:scale(.96)}
.hc .ic{font-size:30px;line-height:1.1;margin-top:8px}
.hc .nm{font:600 13px/1.15 Georgia,serif}
.hc .fr{font-size:11px;color:var(--mut)}
.hc .fl{position:absolute;left:7px;top:6px;font-size:11px;color:var(--ember)}
.hc .inf{position:absolute;right:2px;top:0;border:0;background:none;color:var(--mut);font-size:16px;padding:6px 8px}
.dots{display:flex;gap:3px;margin-top:auto}
.dots b{width:9px;height:9px;border-radius:3px;background:#3a2d20}
.dots b.on{background:var(--ember);box-shadow:0 0 6px #ff8f3f80}
.dots b.t{outline:1.5px solid var(--edge);outline-offset:1px}
.hc.done{background:linear-gradient(180deg,#2a1d12,#3a2210);border-color:#a95a22;box-shadow:0 0 18px #ff8f3f30}
.hc.done::after{content:"✔";position:absolute;inset:0;display:grid;place-items:center;font-size:54px;color:#ff8f3f55;pointer-events:none}
.hc.q .ic{filter:hue-rotate(0)}
.hc.add{border-style:dashed;background:transparent;color:var(--mut);justify-content:center}
.chk{border:1px solid #a8392c;border-radius:16px;padding:14px;background:linear-gradient(160deg,#3b1a14,#1f120d);box-shadow:0 0 24px #c9392b33}
.chk h3{font-size:18px}
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.chest{border:1px solid var(--edge);background:var(--panel);border-radius:12px;padding:12px 0;font-size:34px;color:var(--txt);cursor:pointer}
.chest:active{transform:scale(.94)}
.done-ck{border:1px solid var(--edge);border-radius:14px;padding:10px 14px;color:var(--mut);background:var(--panel)}
.sug{display:flex;align-items:center;gap:10px;border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:10px 12px;margin-bottom:8px}
.sug .ic{font-size:26px}
.sug div{flex:1}
.sug b{font-family:Georgia,serif}
.btn{border:1px solid var(--edge);background:var(--panel2);color:var(--txt);border-radius:999px;padding:9px 16px;font:600 14px system-ui;cursor:pointer}
.btn.p{background:linear-gradient(180deg,#ffa157,#f0742a);color:#2a1204;border:0}
.btn.b{background:linear-gradient(180deg,#d9ab4f,#a77a22);color:#2a1704;border:0}
.btn.d{color:#ff7b86;border-color:#5a2a34}
.seg{display:flex;background:#17100a;border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:999px;font:600 14px system-ui}
.seg button.on{background:var(--panel2);color:var(--gold)}
.attr{display:flex;align-items:center;gap:10px;border:1px solid var(--edge);border-radius:14px;background:var(--panel);padding:10px 12px;margin-bottom:8px}
.attr .ic{font-size:24px}
.attr .m{flex:1}
.attr .t{display:flex;justify-content:space-between;font:600 14px Georgia,serif}
.attr .bar{margin-top:6px;height:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:10px;text-align:center}
.stat b{display:block;font:700 22px Georgia,serif;color:var(--gold)}
.stat span{font-size:12px;color:var(--mut)}
.ach{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ac{border:1px solid var(--edge);border-radius:12px;background:var(--panel);padding:8px 2px;text-align:center;font-size:11px;color:var(--mut);opacity:.45}
.ac span{display:block;font-size:26px}
.ac.on{opacity:1;color:var(--txt);border-color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;background:#150f0aee;backdrop-filter:blur(8px);border-top:1px solid var(--edge);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);font:600 12px system-ui;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}
nav button.on{color:var(--blue)}
#ov{position:fixed;inset:0;background:#000a;z-index:9;display:none;align-items:flex-end}
#ov.on{display:flex}
#sheet{width:100%;max-width:520px;margin:0 auto;background:linear-gradient(180deg,#33251a,var(--panel));border:1px solid var(--edge);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sh{display:flex;gap:12px;align-items:center}
.sh .ic{font-size:36px;width:60px;height:60px;border-radius:14px;background:#17100a;display:grid;place-items:center}
.why{background:#17100a;border-radius:12px;padding:12px;margin:14px 0;color:#e0d2b4}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--edge);border-radius:999px;padding:4px 10px;font-size:12px}
.acts{display:flex;gap:8px;margin-top:14px}
.acts .btn{flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],select{width:100%;background:#17100a;border:1px solid var(--edge);border-radius:10px;color:var(--txt);padding:11px;font:15px system-ui}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--gold);color:#2a1d04;font:700 15px Georgia,serif;padding:10px 18px;border-radius:999px;z-index:20;transition:transform .3s;box-shadow:0 6px 24px #0008;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
.hero,.chk{border:3px double #8a6a3a}.hc,.attr,.sug,.stat,.ac,.done-ck{border-radius:8px}.rank{border-radius:6px 6px 24px 24px}
#wiz{display:none;position:fixed;inset:0;z-index:15;overflow:auto;background:radial-gradient(120% 60% at 50% -10%,#3a2414 0,var(--void) 60%);padding-top:env(safe-area-inset-top)}
#wiz.on{display:block}
.wc{max-width:520px;margin:0 auto;padding:28px 18px calc(40px + env(safe-area-inset-bottom))}
.wc h1{font-size:24px;line-height:1.2}
.wc p{margin:10px 0 4px}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px;border-radius:8px;border:1px solid var(--edge);background:var(--panel);color:var(--txt);font:15px system-ui;cursor:pointer}
.opt.on{border-color:var(--blue);background:#3a2a16;box-shadow:0 0 12px #d9ab4f30}
.wc .acts{margin-top:22px}
.rvc{border:1px solid var(--edge);border-radius:8px;background:var(--panel);padding:12px;margin-top:10px}
.rvc .t{display:flex;align-items:center;gap:8px;font:600 15px Georgia,serif;margin-bottom:8px}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini .btn{padding:7px 12px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="ov"><div id="sheet"></div></div>
<div id="wiz"></div>
<div id="toast"></div>
<script>
const K='thesystem_v2',XP=[10,20,35,50,75],DN=['Muy fácil','Fácil','Intermedia','Difícil','Especial'];
const ATTR={dis:['Disciplina','🛡️'],con:['Conocimiento','📚'],sal:['Salud','❤️'],org:['Organización','🗂️'],fin:['Finanzas','💰'],cre:['Creatividad','✨']};
const CAT={const:['Constancia','dis'],sal:['Salud','sal'],fin:['Finanzas','fin'],hig:['Higiene','sal'],apr:['Aprendizaje','con'],pro:['Productividad','org'],des:['Desarrollo personal','con'],cont:['Contenido','cre']};
const T=[
['uno','☝️','Hacer una cosa pequeña a propósito','const',0,'diaria','La constancia se entrena con acciones mínimas. Lo importante es no romper la cadena, no el tamaño de la acción.'],
['rev','🔁','Revisar mis misiones del día','const',0,'diaria','Abrir el sistema cada día es el hábito que sostiene a todos los demás.'],
['agua','💧','Tomar un vaso de agua','sal',0,'diaria','Tomar agua con constancia ayuda a la energía y la concentración, y es una buena base para dejar bebidas azucaradas.'],
['cam','🚶','Caminar 10 minutos','sal',1,'3 días por semana','Moverte un poco cada día mejora el ánimo, el sueño y la salud del corazón.'],
['fru','🍎','Comer una fruta o verdura','sal',0,'diaria','Variar los alimentos es más fácil si empiezas sumando algo, no quitando.'],
['com','🍽️','Planear la próxima comida','sal',1,'3 días por semana','Decidir antes de tener hambre evita comer lo primero que aparece.'],
['azu','🥤','Sin bebida azucarada hoy','sal',1,'diaria','Cada día que resistes baja el azúcar que tomas y refuerza tu control.',1],
['gas','🧾','Anotar un gasto','fin',0,'diaria','Anotar un solo gasto ya mantiene vivo el registro. Lo difícil es retomarlo, no hacerlo.'],
['deu','📋','Escribir una deuda y su monto','fin',1,'2 días por semana','No puedes organizar lo que no ves. Tener la lista completa es el primer paso.'],
['aho','🐷','Apartar una moneda para ahorro','fin',1,'2 días por semana','El monto importa menos que crear la costumbre de apartar algo.'],
['die','🪥','Lavarme los dientes','hig',0,'diaria','Es el hábito más corto con más retorno: salud dental y una señal diaria de cuidado personal.'],
['dus','🚿','Rutina de aseo','hig',0,'diaria','Una rutina fija evita decidir cada día y hace que el aseo sea automático.'],
['ord','🧹','Ordenar mi espacio 5 minutos','hig',1,'3 días por semana','Cinco minutos bastan para que el espacio deje de acumularse.'],
['py','🐍','Practicar Python 15 minutos','apr',2,'2 días por semana','Python es la base del análisis de datos. Practicar poco y seguido supera a las maratones.'],
['sql','🗄️','Resolver un ejercicio de SQL','apr',2,'2 días por semana','SQL es lo que más piden en puestos de datos. Un ejercicio por sesión construye el hábito.'],
['dat','📊','Mirar un conjunto de datos o gráfico','apr',1,'2 días por semana','Leer datos reales entrena el ojo analítico antes de saber todas las herramientas.'],
['pen','📝','Anotar 3 pendientes','pro',0,'diaria','Sacar los pendientes de la cabeza libera atención y baja el estrés.'],
['pla','📅','Planear el día siguiente','pro',1,'3 días por semana','Un plan corto con horarios variables te evita improvisar todo.'],
['lee','📖','Leer 5 páginas','des',0,'diaria','Cinco páginas al día son varios libros al año, y la atención se reconstruye con cada página.'],
['cur','🔎','Investigar un tema curioso','des',1,'2 días por semana','La curiosidad alimenta ideas, conversación y contenido.'],
['ide','💡','Anotar una idea de contenido','cont',0,'2 días por semana','Las ideas se pierden si no se anotan. Una por vez alimenta el canal.'],
['gui','🎬','Escribir parte de un guion','cont',2,'2 días por semana','Avanzar un poco el guion hace que publicar deje de ser un salto grande.'],
['pub','📤','Publicar contenido','cont',3,'2 días por semana','Publicar es lo que cuenta. Cada video subido te enseña más que diez planeados.']
];
const mk=t=>({id:t[0],i:t[1],n:t[2],c:t[3],d:t[4],f:t[5],w:t[6],q:t[7]||0});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.h)S={s:day(0),h:['uno','agua','die','pen','lee'].map(id=>mk(T.find(t=>t[0]==id))),l:{},ck:{}};
const CM=day(0).slice(0,7);if(!S.mo)S.mo={key:CM,goal:''};
let tab='hoy',seg='h';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const act=()=>S.h.filter(h=>!h.x);
const done=(id,n=0)=>S.l[id]&&S.l[id][day(n)];
function calc(){let tot=0,n=0,ax={};for(const h of S.h){const a=CAT[h.c]?CAT[h.c][1]:'dis';for(const k in S.l[h.id]||{}){const x=S.l[h.id][k];tot+=x;n++;ax[a]=(ax[a]||0)+x}}
 let ck=0;for(const k in S.ck){tot+=S.ck[k];ck++}
 const lv=Math.floor(tot/100)+1;return{tot,n,ax,ck,lv,rk:lv<=5?'E':lv<=10?'D':lv<=20?'C':lv<=30?'B':lv<=40?'A':'S'}}
const streak=id=>{let n=0,i=done(id)?0:1;while(S.l[id]&&S.l[id][day(i)]){n++;i++}return n};
const anyDay=n=>S.h.some(h=>S.l[h.id]&&S.l[h.id][day(n)]);
function gstreak(){let best=0,cur=0;for(let i=120;i>=0;i--){if(anyDay(i)){cur++;best=Math.max(best,cur)}else cur=0}return best}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function dots(id){let s='';for(let i=6;i>=0;i--)s+='<b class="'+(done(id,i)?'on':'')+(i==0?' t':'')+'"></b>';return'<div class="dots">'+s+'</div>'}
function card(h){const st=streak(h.id);return'<div class="hc'+(done(h.id)?' done':'')+(h.q?' q':'')+'" data-a="tog" data-id="'+h.id+'">'+(st?'<span class="fl">🔥 '+st+'</span>':'')+'<button class="inf" data-a="info" data-id="'+h.id+'" aria-label="Detalle">ⓘ</button><div class="ic">'+h.i+'</div><div class="nm">'+esc(h.n)+'</div><div class="fr">'+esc(h.f)+'</div>'+dots(h.id)+'</div>'}
function vHoy(){const c=calc(),t=day(0),n=Math.floor((new Date(t+'T00:00')-new Date(S.s+'T00:00'))/864e5)+1;
 const lvx=c.tot%100;
 let h='<div class="hero"><div class="row"><div class="rank">'+c.rk+'</div><div style="flex:1"><h1>'+(S.ev&&S.ev.name?esc(S.ev.name)+', nivel ':'Nivel ')+c.lv+'</h1><div class="sub">'+MN[+t.slice(5,7)-1]+', día '+(+t.slice(8))+' de '+dimOf(t.slice(0,7))+'. Racha: '+gstreak()+' días</div></div></div><div class="bar"><i style="width:'+lvx+'%"></i></div><div class="sub" style="margin-top:6px">'+lvx+' de 100 XP para el siguiente nivel</div></div>';
 h+='<div class="done-ck" style="margin-top:12px;cursor:pointer" data-a="goal">🎯 '+(S.mo.goal?'Meta del mes: '+esc(S.mo.goal):'Fijar la meta del mes')+'</div>';
 if(!S.ck[t])h+='<h2>Cofres del día</h2><div class="chk"><h3>Un nuevo amanecer</h3><div class="sub">Elige una vasija y reclama tu botín de XP.</div><div class="chests"><button class="chest" data-a="chest">🏺</button><button class="chest" data-a="chest">🏺</button><button class="chest" data-a="chest">🏺</button></div></div>';
 else h+='<div class="done-ck" style="margin-top:12px">Botín del día reclamado: +'+S.ck[t]+' XP</div>';
 const hs=act(),dn=hs.filter(x=>done(x.id)).length;
 h+='<h2>Misiones del reino <small>'+dn+' de '+hs.length+'</small></h2>';
 h+=hs.length?'<div class="grid">'+hs.map(card).join('')+'<div class="hc add" data-a="tab" data-t="hab"><div class="ic">＋</div><div class="nm">Nueva misión</div></div></div>':'<div class="done-ck">Aún no tienes misiones. Agrega una desde el catálogo.</div>';
 const own=new Set(hs.map(x=>x.id)),pool=T.filter(x=>!own.has(x[0])&&!x[7]),k=Math.floor(Date.now()/864e5);
 if(pool.length){h+='<h2>El heraldo sugiere</h2>';for(let i=0;i<Math.min(3,pool.length);i++){const x=pool[(k+i*5)%pool.length];h+='<div class="sug"><div class="ic">'+x[1]+'</div><div><b>'+x[2]+'</b><div class="sub">'+CAT[x[3]][0]+', '+XP[x[4]]+' XP</div></div><button class="btn b" data-a="add" data-id="'+x[0]+'">Añadir</button></div>'}}
 return h}
function vHab(){const own=new Set(act().map(x=>x.id));
 let h='<div class="seg"><button class="'+(seg=='h'?'on':'')+'" data-a="seg" data-t="h">Hábitos</button><button class="'+(seg=='q'?'on':'')+'" data-a="seg" data-t="q">Dejar malos hábitos</button></div><div class="grid">';
 h+='<div class="hc add" data-a="newf"><div class="ic">📝</div><div class="nm">Crear la tuya</div></div>';
 for(const x of T.filter(x=>seg=='q'?x[7]:!x[7])){h+='<div class="hc'+(own.has(x[0])?' done':'')+'" data-a="'+(own.has(x[0])?'info':'add')+'" data-id="'+x[0]+'"><div class="ic">'+x[1]+'</div><div class="nm">'+x[2]+'</div><div class="fr">'+x[5]+'</div><div class="fr">'+XP[x[4]]+' XP</div></div>'}
 if(seg=='q')for(const x of S.h.filter(x=>x.custom&&x.q&&!x.x))h+=card(x);
 return h+'</div>'}
const AC=[['⚔️','Primera misión',s=>s.n>=1],['🔥','Racha de 3 días',s=>s.g>=3],['🌋','Racha de 7 días',s=>s.g>=7],['🎯','10 misiones',s=>s.n>=10],['🏅','50 misiones',s=>s.n>=50],['⭐','Nivel 5',s=>s.lv>=5],['👑','Nivel 10',s=>s.lv>=10],['🏺','5 check-ins',s=>s.ck>=5]];
function vPer(){const c=calc(),s={n:c.n,g:gstreak(),lv:c.lv,ck:c.ck};
 let h='<div class="stats"><div class="stat"><b>'+c.tot+'</b><span>XP total</span></div><div class="stat"><b>'+c.n+'</b><span>Misiones</span></div><div class="stat"><b>'+s.g+'</b><span>Mejor racha</span></div></div><h2>Atributos</h2>';
 for(const k in ATTR){const x=c.ax[k]||0;h+='<div class="attr"><div class="ic">'+ATTR[k][1]+'</div><div class="m"><div class="t"><span>'+ATTR[k][0]+'</span><span>Nv. '+(Math.floor(x/50)+1)+'</span></div><div class="bar"><i style="width:'+(x%50)*2+'%"></i></div></div></div>'}
 h+='<h2>Hazañas</h2><div class="ach">'+AC.map(a=>'<div class="ac'+(a[2](s)?' on':'')+'"><span>'+a[0]+'</span>'+a[1]+'</div>').join('')+'</div>';

 const ks=Object.keys(S.rv||{}).sort().reverse();if(ks.length)h+='<h2>Meses anteriores</h2>'+ks.map(k=>{const r=S.rv[k];return'<div class="sug"><div class="ic">📜</div><div><b>'+mname(k)+' '+k.slice(0,4)+'</b><div class="sub">'+r.xp+' XP, '+r.n+' misiones, '+r.days+' días activos, mejor racha '+r.best+(r.goal?'. Meta: '+esc(r.goal):'')+'</div></div></div>'}).join('');
 h+='<h2>Datos</h2><div class="acts"><button class="btn" data-a="exp">Copiar respaldo</button><button class="btn" data-a="imp">Restaurar</button></div><div class="acts"><button class="btn" data-a="wopen">Repetir evaluación</button></div><div class="acts"><button class="btn d" data-a="rst">Reiniciar todo</button></div>';

 $('#nav').innerHTML=[['hoy','🔥','Hoy'],['hab','➕','Misiones'],['per','🛡️','Héroe']].map(x=>'<button class="'+(tab==x[0]?'on':'')+'" data-a="tab" data-t="'+x[0]+'"><span>'+x[1]+'</span>'+x[2]+'</button>').join('')}

function tog(id){const h=S.h.find(x=>x.id==id),L=S.l[id]=S.l[id]||{},t=day(0),b=calc().lv;
 if(L[t]){delete L[t];toast('Misión desmarcada')}else{L[t]=XP[h.d];const a=calc();toast(a.lv>b?'¡Subiste al nivel '+a.lv+'!':'+'+XP[h.d]+' XP')}save()}
const Q=[
{k:'name',t:'¿Cómo te llamas, héroe?',type:'text'},

{k:'pain',t:'¿Qué te cuesta hoy?',s:'Marca todo lo que aplique, sin juicios.',o:[['die','Lavarme los dientes a diario'],['dus','Mantener una rutina de aseo'],['gas','Registrar mis gastos'],['aho','Ahorrar'],['ord','Mantener mi espacio ordenado'],['pen','Organizar mis pendientes'],['ide','Avanzar en mis proyectos'],['azu','Tomar menos bebidas azucaradas'],['cam','Moverme o caminar'],['uno','Mantener hábitos varios días']]},
{k:'goal',t:'¿Qué metas quieres lograr?',s:'Marca las que quieras.',o:[['deu','Organizar mis deudas'],['aho','Crear un fondo de ahorro'],['py','Aprender análisis de datos (Python y SQL)'],['cont','Publicar contenido'],['lee','Leer más'],['agua','Beber más agua']]},
{k:'dif',t:'¿Con qué dificultad empezamos?',s:'Puedes subirla cuando quieras.',one:1,o:[[0,'Muy fácil: acciones de uno o dos minutos'],[1,'Fácil: acciones cortas'],[2,'Moderada: retos un poco mayores']]},
{k:'tim',t:'¿Cuánto tiempo tienes al día?',s:'Tus horarios pueden variar: las misiones se hacen a cualquier hora.',one:1,o:[[4,'Unos 15 minutos'],[6,'Unos 30 minutos'],[8,'45 minutos o más']]},
{k:'mg',t:'¿Cuál es tu meta principal de este mes?',s:'Puede ser algo simple. Puedes dejarlo vacío.',type:'text'}

function plan(ev){const pr=ev.pr||[],sc={};
 const c=T.filter(t=>t[4]<=ev.dif).map(t=>{let p=0;const i=pr.indexOf(t[3]);if(i>=0)p+=4-i;if((ev.pain||[]).includes(t[0]))p+=5;if((ev.goal||[]).some(g=>(GM[g]||[]).includes(t[0])))p+=5;return[t,p]}).sort((a,b)=>b[1]-a[1]||a[0][4]-b[0][4]);
 const out=['uno'],cnt={const:1};
 for(const[t,p]of c){if(out.length>=ev.tim)break;if(p<=0||out.includes(t[0]))continue;const cc=cnt[t[3]]||0;if(cc>=(pr.includes(t[3])?3:2))continue;out.push(t[0]);cnt[t[3]]=cc+1}
 for(const id of['agua','die','pen']){if(out.length>=3)break;if(!out.includes(id))out.push(id)}
 return out}
let wz={step:0,a:{}};
function openWiz(){wz={step:0,a:{name:'',pr:[],pain:[],goal:[],dif:null,tim:null,mg:''}};$('#wiz').classList.add('on');wiz()}
function wiz(){const st=wz.step,e=$('#wiz');let h='';
 if(st==0)h='<div class="wc" style="text-align:center;padding-top:60px"><div class="rank" style="margin:0 auto 18px">⚔</div><h1>THE SYSTEM te ha elegido</h1><p class="sub">Responde 7 preguntas cortas y forjaré tu plan del mes. Empezarás con misiones pequeñas, y la dificultad solo sube cuando estés listo.</p><div class="acts"><button class="btn" data-a="wskip">Omitir</button><button class="btn p" data-a="wn">Comenzar</button></div></div>';
 else if(st<=Q.length){const q=Q[st-1];h='<div class="wc"><div class="bar"><i style="width:'+Math.round(st/(Q.length+1)*100)+'%"></i></div><h1 style="margin-top:20px">'+q.t+'</h1>'+(q.s?'<p class="sub">'+q.s+'</p>':'');
  if(q.type=='text')h+='<input type="text" id="wnm" maxlength="20" style="margin-top:14px" value="'+esc(wz.a[q.k]||'')+'" placeholder="'+(q.k=='name'?'Tu nombre o apodo':'Ej.: Anotar mis gastos 3 veces por semana')+'">';
  else h+=q.o.map(o=>{const v=wz.a[q.k],on=q.one?v===o[0]:v.includes(o[0]);return'<button class="opt'+(on?' on':'')+'" data-a="wo" data-v="'+o[0]+'">'+o[1]+'</button>'}).join('');
  h+='<div class="acts"><button class="btn" data-a="wb">Atrás</button><button class="btn p" data-a="wn">Siguiente</button></div></div>'}
 else{const ids=plan(wz.a);h='<div class="wc"><div class="bar"><i style="width:100%"></i></div><h1 style="margin-top:20px">Tu plan inicial</h1><p class="sub" style="margin-bottom:12px">'+ids.length+' misiones para empezar. El resto del catálogo sigue disponible y el heraldo te sugerirá nuevas cuando estés listo.</p>'+ids.map(id=>{const t=T.find(x=>x[0]==id);return'<div class="sug"><div class="ic">'+t[1]+'</div><div><b>'+t[2]+'</b><div class="sub">'+CAT[t[3]][0]+', '+XP[t[4]]+' XP</div></div></div>'}).join('')+'<div class="acts"><button class="btn" data-a="wb">Atrás</button><button class="btn p" data-a="wf">Comenzar la aventura</button></div></div>'}
 e.innerHTML=h;e.scrollTop=0}
function wnext(){const st=wz.step;if(st>=1&&st<=Q.length&&Q[st-1].type=='text')wz.a[Q[st-1].k]=($('#wnm').value||'').trim();
 if(st>=1&&st<=Q.length){const q=Q[st-1];if(q.k=='pr'&&!wz.a.pr.length){toast('Elige al menos un área');return}if(q.one&&wz.a[q.k]===null){toast('Elige una opción');return}}
 wz.step++;wiz()}

 ids.forEach(id=>{const o=S.h.find(x=>x.id==id);if(o)o.x=0;else S.h.push(mk(T.find(t=>t[0]==id)))});
 S.ev={name:ev.name,pr:ev.pr,pain:ev.pain,goal:ev.goal,dif:ev.dif,tim:ev.tim,date:day(0)};S.mo={key:CM,goal:ev.mg||(S.mo&&S.mo.key==CM?S.mo.goal:'')};save();$('#wiz').classList.remove('on');tab='hoy';render();scrollTo(0,0);toast('Tu plan está listo')}
const MN=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const mname=k=>MN[+k.slice(5,7)-1];
const dimOf=k=>new Date(+k.slice(0,4),+k.slice(5,7),0).getDate();
function tgt(h,dim){const f=h.f||'';if(/diaria/i.test(f))return Math.round(dim*.8);const m=f.match(/(\d+)/);return Math.max(1,Math.round((m?+m[1]:5)*dim/7))}
function mst(k){const dim=dimOf(k);let xp=0,n=0,days=0,best=0,cur=0;const hs=act().map(h=>({h,d:0}));
 for(let d=1;d<=dim;d++){const dk=k+'-'+String(d).padStart(2,'0');let any=false;hs.forEach(o=>{const x=S.l[o.h.id]&&S.l[o.h.id][dk];if(x){o.d++;n++;xp+=x;any=true}});if(S.ck[dk])xp+=S.ck[dk];if(any){days++;cur++;best=Math.max(best,cur)}else cur=0}
 return{dim,xp,n,days,best,hs:hs.map(o=>{const t=tgt(o.h,dim);return{h:o.h,d:o.d,t,r:Math.min(1,o.d/t)}})}}
const REC={up:'Consolidada. Puedes subir la dificultad.',keep:'En progreso. Sigue otro mes.',chg:'No se consolidó. Cámbiala por otra más simple o quítala.'};
const recOf=r=>r>=.8?'up':r>=.4?'keep':'chg';

function rview(){const e=$('#wiz'),st=rv.st;let h;
 if(rv.step==0){h='<div class="wc"><h1>Revisión de '+mname(rv.k).toLowerCase()+'</h1><p class="sub">Mira cómo te fue y decide qué hacer con cada misión el mes que viene.</p><div class="stats" style="margin-top:14px"><div class="stat"><b>'+st.xp+'</b><span>XP ganada</span></div><div class="stat"><b>'+st.n+'</b><span>Misiones</span></div><div class="stat"><b>'+st.days+'</b><span>Días activos</span></div></div><p class="sub">Mejor racha del mes: '+st.best+' días</p>';
  if(!st.hs.length)h+='<div class="done-ck" style="margin-top:12px">No tienes misiones activas. Pasa al siguiente paso para elegir nuevas.</div>';
  st.hs.forEach(o=>{const q=o.h,a=rv.a[q.id];h+='<div class="rvc"><div class="t"><span style="font-size:24px">'+q.i+'</span><span style="flex:1">'+esc(q.n)+'</span><span class="sub">'+o.d+' de '+o.t+' días</span></div><div class="bar"><i style="width:'+Math.round(o.r*100)+'%"></i></div><div class="sub" style="margin-top:6px">'+REC[recOf(o.r)]+'</div><div class="mini">'+[['keep','Mantener'],['up','Subir'],['chg','Cambiar'],['del','Quitar']].filter(x=>x[0]!='up'||q.d<4).map(x=>'<button class="btn'+(a==x[0]?' p':'')+'" data-a="ra" data-id="'+q.id+'" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div></div>'});
  h+='<div class="acts"><button class="btn" data-a="rl">Más tarde</button><button class="btn p" data-a="rn">Siguiente</button></div></div>'}
 else{const gone=new Set(st.hs.filter(o=>rv.a[o.h.id]=='chg'||rv.a[o.h.id]=='del').map(o=>o.h.id)),keep=new Set(st.hs.filter(o=>!gone.has(o.h.id)).map(o=>o.h.id)),cc=st.hs.filter(o=>rv.a[o.h.id]=='chg').map(o=>o.h.c),pr=(S.ev&&S.ev.pr)||[];
  const pool=T.filter(t=>!keep.has(t[0])&&!gone.has(t[0])).map(t=>{let p=(cc.includes(t[3])?6:0)+Math.max(0,3-pr.indexOf(t[3]))*(pr.includes(t[3])?1:0)-t[4];return[t,p]}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  h='<div class="wc"><h1>Objetivos de '+mname(CM).toLowerCase()+'</h1><p class="sub">Escribe tu meta del mes y elige misiones nuevas. Las primeras reemplazan lo que cambiaste o se ajustan a tus áreas. Con poco tiempo diario, suma pocas.</p><label>Meta del mes</label><input type="text" id="rg" maxlength="80" value="'+esc(rv.goal||'')+'" placeholder="Ej.: Anotar mis gastos 3 veces por semana"><label>Misiones sugeridas</label>'+pool.map(([t])=>'<div class="sug"><div class="ic">'+t[1]+'</div><div><b>'+t[2]+'</b><div class="sub">'+CAT[t[3]][0]+', '+XP[t[4]]+' XP, '+t[5]+'</div></div><button class="btn'+(rv.add.includes(t[0])?' p':' b')+'" data-a="rt" data-id="'+t[0]+'">'+(rv.add.includes(t[0])?'Añadida':'Añadir')+'</button></div>').join('')+'<div class="acts"><button class="btn" data-a="rb">Atrás</button><button class="btn p" data-a="rf">Comenzar el mes</button></div></div>'}
 e.innerHTML=h;e.scrollTop=0}

});
